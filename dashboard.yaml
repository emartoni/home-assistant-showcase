            \ || '°C';\n\n  return `${Math.round(value)}`\n    + `<span style=\"font-size:0.5em;\"\
            > ${unit}</span>`;\n]]]\n"
          feellike: "[[[\n  const raw = entity?.attributes?.feels_like;\n  const value\
            \ = Number(raw);\n\n  if (!Number.isFinite(value)) {\n    return 'Sensação:\
            \ Indisponível';\n  }\n\n  const unit = entity.attributes?.temp_unit ||\
            \ '°C';\n\n  return `Sensação: ${Math.round(value)}`\n    + `<span style=\"\
            font-size:0.6em;\"> ${unit}</span>`;\n]]]\n"
          wind: "[[[\n  const speed = entity?.attributes?.wind_speed;\n  const unit\
            \ = entity?.attributes?.wind_unit || '';\n  const dir = entity?.attributes?.wind_dir;\n\
            \  const desc = entity?.attributes?.wind_desc;\n\n  const speedValid =\
            \ Number.isFinite(Number(speed));\n  const dirValid = dir !== undefined\
            \ && dir !== null && dir !== '';\n  const descValid = desc !== undefined\
            \ && desc !== null && desc !== '';\n\n  const speedLine = speedValid\n\
            \    ? `${Number(speed)} <span style=\"font-size:0.6em\">${unit}</span>`\n\
            \    : 'Indisponível';\n\n  const descLine = (descValid || dirValid)\n\
            \    ? `${descValid ? desc : ''}${descValid && dirValid ? ' ' : ''}${dirValid\
            \ ? `(${dir})` : ''}`\n    : 'Indisponível';\n\n  return `\n         \
            \ <ha-icon icon=\"mdi:weather-windy\"\n            style=\"\n        \
            \      width: 16px;\n              height: 16px;\n            \"></ha-icon>\n\
            \          ${speedLine}<br />\n          <span style=\"font-size:0.8em\"\
            >\n          <ha-icon icon=\"mdi:windsock\"\n            style=\"\n  \
            \            width: 16px;\n              height: 16px;\n            \"\
            ></ha-icon>\n          ${descLine}\n          </span>\n          `;\n\
            ]]]\n"
          rain: "[[[\n  const precip = entity?.attributes?.precipitation;\n  const\
            \ precipUnit = entity?.attributes?.precipitation_unit || '';\n  const\
            \ humidity = entity?.attributes?.humidity;\n\n  const precipNumber = Number(precip);\n\
            \  const humidityNumber = Number(humidity);\n  const precipValid = Number.isFinite(precipNumber);\n\
            \  const humidityValid = Number.isFinite(humidityNumber);\n\n  const precipLine\
            \ = precipValid\n    ? `${precipNumber} <span style=\"font-size:0.6em\"\
            >${precipUnit}</span>`\n    : 'Indisponível';\n  const precipColor = precipNumber\
            \ > 0 \n    ? 'dodgerblue'\n    : 'black';\n\n  const humidityLine = humidityValid\n\
            \    ? `${humidityNumber}%`\n    : 'Indisponível';\n  const humidityColor\
            \ = humidityNumber > 70\n    ? 'deepskyblue'\n    : 'black';\n\n  return\
            \ `\n          <ha-icon icon=\"mdi:weather-rainy\"\n            style=\"\
            \n              width: 16px;\n              height: 16px;\n          \
            \    color: ${precipColor};\n            \"></ha-icon>\n          ${precipLine}\n\
            \          <br />\n          <span style=\"font-size:0.8em\">\n      \
            \    <ha-icon icon=\"mdi:water-percent\"\n            style=\"\n     \
            \         width: 16px;\n              height: 16px;\n              color:\
            \ deepskyblue\n            \"></ha-icon>\n          ${humidityLine}\n\
            \          </span>\n          `;\n]]]\n"
