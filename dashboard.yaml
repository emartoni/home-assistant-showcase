        ## {{state_attr(e, "welcome")}}

        Hoje além de ser um dia <strong>{{state_attr(e, "weather")}}</strong>, também
        será <strong>{{state_attr(e, "temp_variation")}}</strong> que ontem e a qualidade
        do ar está <strong>{{state_attr(e, "air_condition")}}</strong>.


        A internet está <strong>{{state_attr(e, "internet_state")}}</strong> e <strong>{{state_attr(e,
        "cameras")}}</strong>.


        Estamos consumindo <strong>{{state_attr(e, "energy_use")}}</strong> de origem
        <strong>{{state_attr(e, "energy_source")}}</strong> e economizando <strong>{{state_attr(e,
        "saving")}}</strong> na bandeira tarifária <strong>{{state_attr(e, "energy_flag")}}</strong>.'
