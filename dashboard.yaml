  weather_desktop_day:
    entity: '[[[ return variables.entity ]]]'
    show_icon: false
    show_name: false
    variables:
      entity: ''
      for_day: 0
    styles:
      grid:
      - grid-template-areas: '"day" "icon" "temp" "prec"'
      - grid-template-columns: 100%
      - grid-template-rows: min-content min-content min-content min-content
      card:
      - padding: 12px
      - border: 0px
      custom_fields:
        day:
        - justify-self: center
        - align-self: center
        - font-size: 14px
        - font-weight: 600
        - padding-bottom: 8px
        icon:
        - justify-self: center
        - align-self: center
        - padding-bottom: 8px
        temp:
        - justify-self: center
        - align-self: center
        - font-size: 15px
        prec:
        - justify-self: center
        - align-self: center
        - font-size: 11px
        - opacity: 0.8
        - padding-top: 5px
        - font-weight: 300
    custom_fields:
      day: "[[[\n  const rawDate = entity.attributes[`datetime${variables.for_day}`];\n\
        \n  // Guard clause: se não houver valor, retorna vazio sem quebrar o card\n\
        \  if (!rawDate || rawDate === '') {\n    return '-';\n  }\n\n  var weekDay\
        \ = helpers.formatDateWeekdayShort(rawDate);\n\n  // Segunda proteção: caso\
        \ o helper retorne algo inválido mesmo com rawDate preenchido\n  if (!weekDay\
        \ || typeof weekDay !== 'string') {\n    return '';\n  }\n\n  weekDay = weekDay.replace('.',\
        \ '');\n  return weekDay.charAt(0).toUpperCase() + weekDay.slice(1);\n]]]\n"
      icon: "[[[\n  let url = entity?.attributes?.[`cond_icon${variables.for_day}`];\n\
        \n  if (!url) {\n    return '<ha-icon icon=\"mdi:weather-question\"></ha-icon>';\n\
        \  }\n\n  // Verifica se a URL termina com um dos arquivos \"unknown\"\n \
        \ if (url.endsWith('unknown-day.svg') || url.endsWith('unknown-night.svg'))\
        \ {\n    url = url.replace(/unknown-(day|night)\\.svg$/, 'not_available.svg');\n\
        \  }\n\n  return `<img src=\"${url}\" width=\"30\" height=\"30\">`;\n]]]\n"
      temp: "[[[\n  const highRaw =\n    entity?.attributes?.[`temperature${variables.for_day}`];\n\
        \n  const lowRaw =\n    entity?.attributes?.[`low_temperature${variables.for_day}`];\n\
        \n  const high = Number(highRaw);\n  const low = Number(lowRaw);\n\n  if (!Number.isFinite(high)\
        \ || !Number.isFinite(low)) {\n    return 'Indisponível';\n  }\n\n  return\
        \ high.toFixed(0)\n    + '°'\n    + ' <span style=\"font-size:10px;opacity:0.5\"\
        >'\n    + low.toFixed(0)\n    + '°</span>';\n]]]\n"
      prec: "[[[\n  const probability =\n    entity?.attributes?.[`precipitation_prob${variables.for_day}`];\n\
        \n  const unit =\n    entity?.attributes?.precipitation_unit || '';\n\n  const\
        \ value = Number(probability);\n\n  if (!Number.isFinite(value)) {\n    return\
        \ `\n      <ha-icon icon=\"mdi:weather-rainy\"\n        style=\"width:14px;height:14px;\"\
        >\n      </ha-icon>\n      Indisponível\n    `;\n  }\n\n  return `\n    <ha-icon\
        \ icon=\"mdi:weather-rainy\"\n      style=\"width:14px;height:14px;\">\n \
        \   </ha-icon>\n    ${value}% ${unit}\n  `;\n]]]\n"
    tap_action:
      action: more-info
      entity: weather.google_weather
  room_confort:
    variables:
