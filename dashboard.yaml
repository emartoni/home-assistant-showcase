- type: sections
  max_columns: 2
  title: Saúde
  path: saude
  icon: mdi:hospital-box
  sections:
  - type: grid
    cards:
    - type: vertical-stack
      cards:
      - type: gauge
        entity: sensor.system_ha_global_health_score
        name: HAGHS
        unit: ' '
        needle: true
        severity:
          green: 90
          yellow: 75
          red: 0
      - type: markdown
        title: Score Breakdown
        content: '{% set e = ''sensor.system_ha_global_health_score'' %} {% set hw
          = state_attr(e, ''hardware_score'') | int(0) %} {% set app = state_attr(e,
          ''application_score'') | int(0) %} {% set score = states(e) | int(0) %}

          Hardware **{{ hw }}**/100 | Application **{{ app }}**/100

          Formula: ({{ hw }} × 0.4) + ({{ app }} × 0.6) = {{ score }}

          '
      - type: markdown
        title: 🛡️ Advisor
        content: "{% set e = 'sensor.system_ha_global_health_score' %} {% set rec\
          \ = state_attr(e, 'recommendations') | default('', true) %}\n{% if states(e)\
          \ in ['unavailable', 'unknown'] %}\n  ⚠️ Health Advisor sensor is offline.\n\
          {% elif rec not in [none, 'unknown', 'unavailable'] and '✅' not in rec %}\n\
          \  {{ rec }}\n{% else %}\n  ✅ System healthy. No recommendations.\n{% endif\
          \ %}\n"
      - type: conditional
        conditions:
        - condition: numeric_state
          entity: sensor.system_ha_global_health_score
          attribute: zombie_count
          above: -1
        card:
          type: markdown
          title: 📦 Updates & Maintenance
          content: '{% set e = ''sensor.system_ha_global_health_score'' %} {% set
            updates = state_attr(e, ''pending_updates'') | default([], true) | list
            %} {% set db_mb = state_attr(e, ''db_size_mb'') | float(0) %} {% set keep
            = state_attr(e, ''recorder_keep_days'') %} {% set filter = state_attr(e,
            ''recorder_filter_active'') | default(false, true) %} {% set psi = state_attr(e,
            ''psi_available'') | default(false, true) %} {% set _upd = ''/config/updates''
            %}

            {% if updates | length > 0 %}{{ updates | length }} update(s) pending:<br>
            {% for u in updates %}&nbsp;&nbsp; • {{ u }}<br>{% endfor %} [→ Open Updates]({{_upd}})
            {% else %} ✅ All updates installed {% endif %}

            <hr>

            Database: {{ db_mb | round(1) }} MB {% if db_mb == 0.0 %}*(external DB
            detected)*{% endif %}


            Recorder: {% if keep not in [none, ''unknown''] %}purge active ({{ keep
            }} days){% else %}no purge configured — DB may grow indefinitely{% endif
            %}


            {{ ''Entity filter active'' if filter else ''No entity filter'' }}


            {% if keep in [none, ''unknown''] or not filter %} 💡 Tips to improve your
            score: {% if keep in [none, ''unknown''] %} &nbsp;&nbsp; • Set `purge_keep_days`
            in your recorder configuration (+5 pts){% endif %} {% if not filter %}
            &nbsp;&nbsp; • Configure an `include` / `exclude` entity filter for the
            recorder (+5 pts){% endif %} {% endif %}


            ---

            **Metric source**: {% if psi %}🟢 PSI active (CPU + RAM + I/O + Disk) —
            hardware score uses 4 components{% else %}⚙️ Classic sensors (CPU + RAM
            + Disk) — hardware score uses 3 components{% endif %}

            '
      - type: markdown
        title: 🧟 Zombie Entities
        content: "{% set e = 'sensor.system_ha_global_health_score' %} {% set z_raw\
          \ = state_attr(e, 'zombie_entities') | default([], true) %} {% set z_count\
          \ = state_attr(e, 'zombie_count') | int(0) %}\n{% if z_count == 0 %}\n \
          \ ✅ No zombie entities detected.\n{% else %}\n  {% if z_raw is string %}\n\
          \    {% set z_list = z_raw.split(',') | map('trim') | list %}\n  {% else\
          \ %}\n    {% set z_list = z_raw | list %}\n  {% endif %}\n  {% set ghosts\
          \ = z_list | select('match', '^\\\\[unregistered\\\\]') | list %}\n  {%\
          \ set tracked = z_list | reject('match', '^\\\\[unregistered\\\\]') | list\
          \ %}\n  {% set grouped = expand(tracked) | groupby('domain') %}\n\n  {#\
          \ Domain count: prefer the HAGHS v2.3+ attribute when present.\n     Fall\
          \ back to extracting the distinct domains from z_list so the\n     card\
          \ keeps working on older HAGHS versions that do not expose\n     zombie_count_per_domain.\
          \ #}\n  {% set per_domain = state_attr(e, 'zombie_count_per_domain') %}\n\
          \  {% if per_domain %}\n    {% set domain_count = per_domain | length %}\n\
          \  {% else %}\n    {% set ns = namespace(seen=[]) %}\n    {% for entry in\
          \ z_list %}\n      {% set dom = (entry | replace('[unregistered] ', '')).split('.')[0]\
          \ %}\n      {% if dom not in ns.seen %}\n        {% set ns.seen = ns.seen\
          \ + [dom] %}\n      {% endif %}\n    {% endfor %}\n    {% set domain_count\
          \ = ns.seen | length %}\n  {% endif %}\n\n  {{ z_count }} zombie(s) across\
          \ {{ domain_count }} domain(s)\n  {% if per_domain %} ({% for dom, cnt in\
          \ per_domain.items() %}{{ dom }}: {{ cnt }}{% if not loop.last %}, {% endif\
          \ %}{% endfor %}){% endif %}\n  {% if z_count > z_list | length %}*(showing\
          \ first {{ z_list | length }} — {{ z_count - z_list | length }} more hidden)*{%\
          \ endif %}\n\n  {% set _ent = '/config/entities' %}[→ Check Entities]({{\
          \ _ent }})\n\n  {% for domain in grouped %}\n  <details>\n  <summary>{{\
          \ domain[0] | title }}: {{ domain[1] | count }}</summary>\n  {% for item\
          \ in domain[1] %}\n  &nbsp;&nbsp; • {{ device_attr(item.entity_id, 'name')\
          \ | default('unknown device', true) }} — {{ item.name }} (`{{ item.entity_id\
          \ }}`): {{ item.state }}\n  {% endfor %}\n  </details>\n  {% endfor %}\n\
          \n  {% if ghosts | length > 0 %}\n  <details>\n  <summary>⚠️ Unregistered:\
          \ {{ ghosts | length }}</summary>\n  {% for entry in ghosts %}\n  &nbsp;&nbsp;\
          \ • `{{ entry | replace('[unregistered] ', '') }}`\n  {% endfor %}\n  </details>\n\
          \  {% endif %}\n{% endif %}\n"
      grid_options:
        columns: full
    column_span: 1
