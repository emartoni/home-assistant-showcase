- type: sections
  max_columns: 3
  title: Dispositivos
  path: devices
  icon: mdi:cog
  theme: Mushroom
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: ''
      subtitle: Raspberry Pi
    - type: custom:decluttering-card
      template: rpi_status
    - square: false
      type: grid
      cards:
      - type: custom:decluttering-card
        template: disk_usage
        variables:
        - name: Disco Ocupado
        - entity: sensor.system_monitor_disk_use
        - entity_second: sensor.system_monitor_disk_usage
        - entity_aux: sensor.tamanho_total_disco
        - color: lightseagreen
        - icon: mdi:harddisk-remove
      - type: custom:decluttering-card
        template: disk_usage
        variables:
        - name: Espaço Livre
        - entity: sensor.system_monitor_disk_free
        - entity_second: sensor.disco_livre
        - entity_aux: sensor.tamanho_total_disco
        - color: darkgreen
        - icon: mdi:harddisk-plus
      columns: 2
    - type: custom:decluttering-card
      template: raspberry_fan
    - type: custom:vertical-stack-in-card
      cards:
      - type: tile
        entity: sensor.system_monitor_processor_temperature
        name: Temperatura Raspberry
        color: coral
        state_content: last_changed
        vertical: false
        tap_action:
          action: none
        features_position: bottom
      - type: custom:apexcharts-card
        cache: true
        update_interval: 30min
        apex_config:
          xaxis:
            tooltip:
              enabled: false
          chart:
            height: 200px
            animations:
              enabled: false
          yaxis:
            tickAmount: 5
            decimalsInFloat: 0
          tooltip:
            x:
              format: dd-MMM
        header:
          show: false
          title: Temperatura Raspberry
          show_states: false
          colorize_states: true
          disable_actions: true
        hours_12: false
        series:
        - entity: sensor.system_monitor_processor_temperature
          name: Temperatura
          type: area
          opacity: 0.2
          stroke_width: 2
          color: coral
          group_by:
            func: max
            duration: 30min
        card_mod:
          style: "ha-card {\n  border: none;\n}\n"
    - type: horizontal-stack
      cards:
      - type: custom:decluttering-card
        template: mushroom_chart
        variables:
        - entity: sensor.system_monitor_network_throughput_in_end0
        - name: Taxa Entrada
        - color: seagreen
        - icon: mdi:arrow-down-bold-circle-outline
        - height: 170
        - entity_suffix: ' MB/s'
        - show_extrema: true
      - type: custom:decluttering-card
        template: mushroom_chart
        variables:
        - entity: sensor.system_monitor_network_throughput_out_end0
        - name: Taxa Saída
        - color: sienna
        - icon: mdi:arrow-up-bold-circle-outline
        - height: 170
        - entity_suffix: ' MB/s'
        - show_extrema: true
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: ''
      subtitle: Roteador
    - type: custom:button-card
      show_state: true
      entity: binary_sensor.huawei_router_internet_connection
      name: Conexões Roteador
      icon: mdi:router-network-wireless
      variables:
        total: sensor.huawei_router_total_clients
        max_routers: 2
        router_status: "[[[\n  const ref = states[variables.total];\n\n  if (!entity\
          \ || !ref) {\n    return 'Desconectado';\n  }\n\n  const estado = entity.state;\n\
          \  const rc = Number(ref.attributes?.hilink_clients);\n\n  if (estado ===\
          \ 'on' && Number.isFinite(rc) && rc >= variables.max_routers) {\n    return\
          \ 'Conectado';\n  }\n\n  if (estado === 'on' && Number.isFinite(rc)) {\n\
          \    return 'Problema';\n  }\n\n  return 'Desconectado';\n]]]\n"
      state_display: '[[[ return variables.router_status; ]]]'
      custom_fields:
        cli: "[[[\n  const ref = states[variables.total];\n  const raw = ref?.state;\n\
          \n  if (raw === undefined || raw === null || raw === '') {\n    return `\n\
          \      <span style=\"font-size:35px;font-weight:700;\">\n        Indisponível\n\
          \      </span>\n      <br/>\n      <span style=\"color:grey;\">\n      \
          \  Total Clientes\n      </span>\n    `;\n  }\n\n  return `\n    <span style=\"\
          font-size:35px;font-weight:700;\">\n      ${raw}\n    </span>\n    <br/>\n\
          \    <span style=\"color:grey;\">\n      Total Clientes\n    </span>\n \
          \ `;\n]]]\n"
        bar:
          card:
            type: custom:vertical-stack-in-card
            cards:
            - type: custom:entity-progress-card
              entity: '[[[ return variables.total; ]]]'
              attribute: hilink_clients
              max_value: "[[[\n  const value = Number(states[variables.total]?.state);\n\
                \  return Number.isFinite(value) ? value : 0;\n]]]\n"
              decimal: 0
              disable_unit: true
              icon: mdi:lan
              bar_size: large
              bar_effect:
              - radius
              hide:
              - name
              - value
              frameless: true
              marginless: true
              bar_color: mediumseagreen
              color: mediumseagreen
            - type: custom:entity-progress-card
              entity: '[[[ return variables.total; ]]]'
              attribute: wireless_clients
              max_value: '[[[ return variables.total; ]]]'
              decimal: 0
              disable_unit: true
              icon: mdi:wifi
              bar_size: large
              bar_effect:
              - radius
              hide:
              - name
              - value
              frameless: true
              marginless: true
              bar_color: deepskyblue
              color: deepskyblue
            card_mod:
              style: "ha-card { border: none; }\n#root {\n  gap: 0px !important;\n\
                }\n"
        ring:
          card:
            type: horizontal-stack
            cards:
            - type: custom:ring-tile
              bottom_element: ring_unit
              top_element: icon
              icon: mdi:wifi-plus
              ring_only: true
              ring_size: 2
              ring_type: closed
              max_decimals: 0
              entity:
                entity: '[[[ return variables.total; ]]]'
                attribute: wifi_5_clients
                unit_of_measurement: 5 GHz
              max:
                entity: '[[[ return variables.total; ]]]'
              color: dodgerblue
              tweaks:
                rt-ring-svg-size: 80px
              card_mod:
                style: 'ha-card { border: none; background: none; }

                  '
            - type: custom:ring-tile
              bottom_element: ring_unit
              top_element: icon
              icon: mdi:wifi
              ring_only: true
              ring_size: 2
              ring_type: closed
              max_decimals: 0
              entity:
                entity: '[[[ return variables.total; ]]]'
                attribute: wifi_2_4_clients
                unit_of_measurement: 2.4 GHz
              max:
                entity: '[[[ return variables.total; ]]]'
              color: deepskyblue
              tweaks:
                rt-ring-svg-size: 80px
              card_mod:
                style: 'ha-card { border: none; background: none; }

                  '
            - type: custom:ring-tile
              bottom_element: ring_unit
              top_element: icon
              icon: mdi:router-network
              ring_only: true
              ring_size: 2
              ring_type: closed
              max_decimals: 0
              entity:
                entity: '[[[ return variables.total; ]]]'
                attribute: lan_clients
                unit_of_measurement: LAN
              max:
                entity: '[[[ return variables.total; ]]]'
              color: aqua
              tweaks:
                rt-ring-svg-size: 80px
              card_mod:
                style: 'ha-card { border: none; background: none; }

                  '
      styles:
        grid:
        - grid-template-areas: '"i n s" "cli cli bar" "ring ring ring"'
        - grid-template-columns: 0.25fr 0.75fr 1fr
        card:
        - padding: 8px 0px
        name:
        - font-size: 14px
        - font-weight: 500
        - justify-self: start
        icon:
        - color: dodgerblue
        state:
        - font-size: 11px
        - letter-spacing: 0.1em
        - text-transform: uppercase
        - justify-self: end
        - padding: 4px 8px
        - border-radius: 12px
        - margin-right: 10px
        - background: "[[[\n  if (variables.router_status === 'Conectado') {\n   \
            \ return 'rgba(0, 128, 0, 0.20)';\n  }\n  if (variables.router_status\
            \ === 'Desconectado') {\n    return 'rgba(255, 0, 0, 0.20)';\n  }\n  return\
            \ 'rgba(255, 165, 0, 0.20)';\n]]]\n"
        - color: "[[[\n  if (variables.router_status === 'Conectado') {\n    return\
            \ 'rgb(0, 128, 0)';\n  }\n  if (variables.router_status === 'Desconectado')\
            \ {\n    return 'rgb(255, 0, 0)';\n  }\n  return 'rgb(255, 165, 0)';\n\
            ]]]\n"
        custom_fields:
          cli:
          - margin-left: 30px
          - justify-self: start
          - font-size: 12px
          - font-weight: 300
          - color: dodgerblue
          bar:
          - margin-left: -70px
          - padding-right: 8px
