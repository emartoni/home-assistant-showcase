          \ 0, 0.20)';\n  }\n  return 'rgba(128, 128, 128, 0.20)';\n]]]\n"
      - border-radius: 200px 200px 200px 200px
      - opacity: "[[[\n  if (entity.state == 'on') return '0.8';\n  else return '0.4';\n\
          ]]]\n"
