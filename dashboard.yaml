  - type: grid
    cards:
    - type: heading
      icon: mdi:clock-outline
      heading: Histórico do Creta
      heading_style: title
    - type: custom:button-card
      triggers_update:
      - sensor.creta_timeline
      show_name: false
      show_state: false
      show_icon: false
      custom_fields:
        timeline: "[[[\n  const raw =\n  states['sensor.creta_timeline']\n  ?.state\
          \ || '';\n\n  const items =\n  raw\n  .split('||')\n  .filter(x => x.trim()\
          \ !== '');\n\n  let rows = '';\n\n  items.forEach((item, index) => {\n\n\
          \    if (!item.includes('|')) return;\n\n    const parts =\n    item.split('|');\n\
          \n    const time = parts[0].replace(' ', ' ⦁ ');\n    const place = parts[1];\n\
          \n    let icon =\n    'mdi:map-marker';\n    \n    let color =\n    'var(--secondary-text-color)';\n\
          \    \n    const zoneId =\n    'zone.' +\n    \n    place\n    .normalize('NFD')\n\
          \    .replace(/[\\u0300-\\u036f]/g, '')\n    .replace(/\\s+/g, '_')\n  \
          \  .toLowerCase();\n    \n    const zone =\n    states[zoneId];\n    \n\
          \    if (zone?.attributes?.icon) {\n    \n      icon =\n      zone.attributes.icon;\n\
          \    \n    }\n\n    if (place.includes('trânsito')) {\n\n      icon = 'mdi:car';\n\
          \      color = 'orange';\n\n    } else if (place.includes('casa')) {\n\n\
          \      icon = 'mdi:home';\n      color = 'green';\n\n    } else if (place.includes('posto'))\
          \ {\n\n      icon = 'mdi:gas-station';\n      color = 'orange';\n\n    }\
          \ else if (place.includes('mãe')) {\n\n      color = 'pink';\n\n    } else\
          \ if (!place.includes('outro')) {\n\n      color = 'var(--primary-color)';\n\
          \n    }\n\n    rows += `\n\n    <div style=\"\n      display:flex;\n   \
          \   align-items:flex-start;\n      gap:14px;\n      margin-bottom:${index\
          \ === items.length -1\n        ? '0'\n        : '18px'};\n    \">\n\n  \
          \    <div style=\"\n        width:55px;\n        font-size:13px;\n     \
          \   opacity:.65;\n        padding-top:1px;\n        padding-right: 15px;\n\
          \        flex-shrink:0;\n      \">\n        ${time}\n      </div>\n\n  \
          \    <div style=\"\n        width:16px;\n        position:relative;\n  \
          \      display:flex;\n        justify-content:center;\n        flex-shrink:0;\n\
          \      \">\n\n        <div style=\"\n          width:10px;\n          height:10px;\n\
          \          border-radius:50%;\n          background:${color};\n        \
          \  margin-top:5px;\n          z-index:2;\n        \">\n        </div>\n\n\
          \        ${\n          index !== items.length -1\n          ? `\n      \
          \      <div style=\"\n              position:absolute;\n              top:16px;\n\
          \              width:2px;\n              height:42px;\n\n              background:\n\
          \              rgba(\n              var(--rgb-primary-text-color),\n   \
          \           .10);\n            \">\n            </div>\n          `\n  \
          \        : ''\n        }\n\n      </div>\n\n      <div style=\"\n      \
          \  display:flex;\n        align-items:center;\n        gap:10px;\n     \
          \   min-width:0;\n      \">\n\n        <ha-icon\n          icon=\"${icon}\"\
          \n          style=\"\n            width:18px;\n            height:18px;\n\
          \            color:${color};\n            flex-shrink:0;\n          \">\n\
          \        </ha-icon>\n\n        <div style=\"\n          font-size:14px;\n\
          \          font-weight:500;\n          text-transform:capitalize;\n    \
          \      line-height:1.3;\n          word-break:break-word;\n        \">\n\
          \          ${place}\n        </div>\n\n      </div>\n\n    </div>\n    `;\n\
          \  });\n\n  return `\n    <div style=\"\n      display:flex;\n      flex-direction:column;\n\
          \      width:100%;\n    \">\n      ${rows}\n    </div>\n  `;\n]]]\n"
      styles:
        grid:
        - grid-template-areas: '"timeline"

            '
        card:
        - padding: 18px
        custom_fields:
          timeline:
          - text-align: left
          - width: 100%
