          card_mod:
            style: "ha-card {\n  border: none;\n}\n* {\n  --rt-font-family: var(--ha-font-family-body);\n\
              }\n"
      label_conforto: "[[[\n  return entity.state;\n]]]\n"
      label_ventilacao: "[[[\n  const attrs = entity?.attributes || {};\n\n  const\
        \ icon = attrs.icon_ventilacao || 'mdi:fan-off';\n  const color = attrs.color_ventilacao\
        \ || 'rgb(128, 128, 128)';\n  const value = attrs.status_ventilacao || 'Indisponível';\n\
        \n  return `<ha-icon icon=\"${icon}\"\n          style=\"\n            width:16px;\n\
        \            height:16px;\n            color:${color};\n          \"></ha-icon>\n\
        \          <span style=\"vertical-align:bottom;\">\n            ${value}\n\
        \          </span>`;\n]]]\n"
      label_umidade_ar_externo: "[[[\n  const attrs = entity?.attributes || {};\n\n\
        \  const umidade = attrs.umidade_status || 'Indisponível';\n  const ar_externo\
        \ = attrs.qualidade_ar_externo || 'Indisponível';\n  const icon = attrs.umidade_icone\
        \ || 'mdi:water-percent';\n  const color = attrs.umidade_cor || 'rgb(30, 144,\
        \ 255)';\n\n\n  return `<ha-icon icon=\"${icon}\"\n          style=\"\n  \
        \          width:16px;\n            height:16px;\n            color:${color};\n\
        \          \"></ha-icon>\n          <span style=\"vertical-align: bottom;\"\
        >\n            ${umidade}\n            ⋅\n            ${ar_externo}\n    \
        \      </span>`;\n]]]\n"
    styles:
      grid:
      - grid-template-areas: '"i n n" "chart chart label_conforto" "chart chart label_ventilacao"
          "chart chart label_umidade_ar_externo"'
      - grid-template-columns: 55px 0.1fr 1fr
      - grid-template-rows: min-content min-content min-content
      card:
      - padding: 8px 8px 0px 0px
      name:
      - font-size: 14px
      - font-weight: 500
      - justify-self: start
      icon:
