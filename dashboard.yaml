      custom_fields:
        label_conforto:
        - font-size: 12px
        - justify-self: start
        - margin-bottom: -5px
        - text-transform: uppercase
        - letter-spacing: 0.1em
        - background: "[[[\n  return variables.bg_color_status;\n]]]\n"
        - color: "[[[\n  return variables.color_status;\n]]]\n"
        - padding: 5px 9px
        - border-radius: 10px
        label_ventilacao:
        - font-size: 12px
        - justify-self: start
        - margin-bottom: -8px
        label_umidade_ar_externo:
        - margin-top: 1px
        - font-size: 12px
        - justify-self: start
  room_card:
    show_state: true
    variables:
      name: ''
      icon: mdi:home
      entity: ''
      navigate: ''
      temp_sensor: ''
      humid_sensor: ''
      sec_entity: ''
      icon_sec_on: mdi:power-plug
      icon_sec_off: mdi:power-plug-off
      state_sec_on: 'on'
      state_sec_off: 'off'
      state_sec_color_on: rgb(30, 144, 255)
      state_sec_background_on: rgba(30, 144, 255, 0.20)
      state_sec_color_off: rgb(128, 128, 128)
      state_sec_background_off: rgba(128, 128, 128, 0.20)
    name: '[[[ return variables.name ]]]'
    icon: '[[[ return variables.icon ]]]'
    entity: '[[[ return variables.entity ]]]'
    tap_action:
      action: navigate
      navigation_path: '[[[ return variables.navigate ]]]'
    state_display: "[[[\n  const invalid = ['unknown', 'unavailable', 'none', ''];\n\
      \n  const tempState =\n    states[variables.temp_sensor]?.state;\n\n  const\
      \ humidState =\n    states[variables.humid_sensor]?.state;\n\n  const tempValid\
      \ =\n    tempState &&\n    !invalid.includes(tempState) &&\n    Number.isFinite(Number(tempState));\n\
      \n  const humidValid =\n    humidState &&\n    !invalid.includes(humidState)\
      \ &&\n    Number.isFinite(Number(humidState));\n\n  if (!tempValid && !humidValid)\
      \ {\n    return ' ';\n  }\n\n  const temp = tempValid\n    ? `${Number(tempState).toFixed(0)}°C`\n\
      \    : 'Indisponível';\n\n  const humid = humidValid\n    ? `${Number(humidState).toFixed(0)}%`\n\
      \    : 'Indisponível';\n\n  return `${temp} ⋅ ${humid}`;\n]]]\n"
    custom_fields:
      btn:
        card:
          type: vertical-stack
          cards:
          - type: custom:button-card
            entity: '[[[ return variables.entity ]]]'
            show_name: false
