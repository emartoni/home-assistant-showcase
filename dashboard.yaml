              - padding: 0px
              - background-color: "[[[\n  if (entity?.state === 'on') {\n    return\
                  \ 'rgba(255, 165, 0, 0.20)';\n  }\n  return 'rgba(128, 128, 128,\
                  \ 0.20)';\n]]]\n"
              - border-radius: 14px
              - place-self: center
              - height: 37px
              icon:
              - color: "[[[\n  if (entity?.state === 'on') {\n    return 'rgb(255,\
                  \ 165, 0)';\n  }\n  return 'rgb(128, 128, 128)';\n]]]\n"
          - type: custom:button-card
            entity: '[[[ return variables.sec_entity ]]]'
            show_name: false
            show_icon: true
            size: 20px
            state:
            - value: '[[[ return variables.state_sec_on ]]]'
              icon: '[[[ return variables.icon_sec_on ]]]'
            - value: '[[[ return variables.state_sec_off ]]]'
              icon: '[[[ return variables.icon_sec_off ]]]'
            styles:
              grid:
              - grid-template-areas: '''i'''
              card:
              - box-shadow: none
              - border: 0px
              - padding: 0px
              - display: "[[[\n  const id = variables.sec_entity;\n  const ref = id\
                  \ ? states[id] : undefined;\n  if (!ref) {\n    return 'none';\n\
                  \  } else {\n    return 'block';\n  }\n\n]]]\n"
              - background-color: "[[[\n  const id = variables.sec_entity;\n  const\
                  \ ref = id ? states[id] : undefined;\n\n  if (!ref) {\n    return\
                  \ 'rgb(128, 128, 128)';\n  }\n\n  const value = ref.state;\n\n \
                  \ if (value === 'unavailable' || value === 'unknown') {\n    return\
                  \ 'rgba(128, 128, 128, 0.20)';\n  }\n\n  return value === variables.state_sec_on\n\
                  \    ? variables.state_sec_background_on\n    : variables.state_sec_background_off;\n\
                  ]]]\n"
              - border-radius: 14px
              - place-self: center
              - height: 37px
              icon:
              - color: "[[[\n  const id = variables.sec_entity;\n  const ref = id\
                  \ ? states[id] : undefined;\n\n  if (!ref) {\n    return 'rgb(128,\
                  \ 128, 128)';\n  }\n\n  const value = ref.state;\n\n  if (value\
                  \ === 'unavailable' || value === 'unknown') {\n    return 'rgb(128,\
                  \ 128, 128)';\n  }\n\n  return value === variables.state_sec_on\n\
                  \    ? variables.state_sec_color_on\n    : variables.state_sec_color_off;\n\
                  ]]]\n"
    styles:
      grid:
      - grid-template-areas: '"n btn" "s btn" "i btn"'
