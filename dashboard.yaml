navbar-templates:
  mobile_navbar:
    desktop:
      hidden: true
    mobile:
      mode: docked
    routes:
    - url: /lovelace/home
      icon: mdi:home
      label: Home
    - url: /lovelace/devices
      icon: mdi:cog
      label: Dispositivos
    - url: /lovelace/cameras
      icon: mdi:cctv
      label: Câmeras
    - url: /lovelace/energy-custom
      icon: mdi:lightning-bolt
      label: Energia
    - url: /lovelace/carro
      icon: mdi:car
      label: Carro
    - url: /lovelace/saude
      icon: mdi:hospital-box
      label: Saúde
    - icon: mdi:dots-horizontal
      label: Mais
      tap_action:
        action: open-popup
      popup:
      - icon: mdi:cog
        url: /config/dashboard
      - icon: mdi:store
        url: /hacs/dashboard
      - icon: mdi:puzzle
        url: /hassio
      - icon: mdi:face-man
        url: /profile
      - icon: mdi:power
        tap_action:
          action: call-service
          service: homeassistant.restart
          service_data: {}
          confirmation:
            text: Deseja realmente reiniciar o Home Assistant?
decluttering_templates:
  room_card:
    default:
    - area: ''
    - light: ''
    - temp: ''
    - hum: ''
    - path: ''
    - icon: ''
    card:
      type: custom:navroom-card
      area: '[[area]]'
      grid_options:
        rows: auto
      light: '[[light]]'
      temp: '[[temp]]'
      humidity: '[[hum]]'
      variant: badge
      height: 105
      padding: 10
      head_height: 30
      row_gap: 4
      icon_size: 32
      name_size: 16
      name_weight: 700
      chip_height: 20
      chip_font: 10
      chip_pad: 10
      chip_gap: 6
      pwr_size: 30
      pwr_icon: 24
      badge_size: 14
      bg_tint: 0.07
      accent_fallback: 255,165,0
      ignore_light_color: true
      tap_action:
        action: navigate
        navigation_path: /lovelace/[[path]]
      power_action:
        action: toggle
      icon: '[[icon]]'
      chip_order:
      - temp
      - humidity
      - light
      - co2
      card_mod:
        style: "ha-card {\n  border: 0.5px solid var(--ha-card-border-color,var(--divider-color,#e0e0e0));\n\
          }\n"
  room_energy_header:
    default:
    - entity: ''
    card:
      type: custom:mushroom-template-card
      primary: Energia
      icon: mdi:lightning-bolt
      features_position: bottom
      color: orange
      entity: '[[entity]]'
      secondary: "{% set raw = states(entity) %}\n{% if raw in ['unknown', 'unavailable',\
        \ 'none', ''] %}\n  Indisponível\n{% else %}\n  {{ raw }} {{ state_attr(entity,\
        \ 'unit_of_measurement') }}\n{% endif %}\n"
  energy_header_card:
    default:
    - entity: ''
    - name: ''
    - icon: mdi:lightning-bolt
    - unit_sufix: kWh
    - unit_prefix: ''
    - decimals: 2
    - color: ''
    card:
      type: custom:mushroom-template-card
      primary: '[[name]]'
      icon: '[[icon]]'
      features_position: bottom
      color: '[[color]]'
      entity: '[[entity]]'
      secondary: "{% set raw = states(entity) %}\n{% if raw in ['unknown', 'unavailable',\
        \ 'none', ''] %}\n  Indisponível\n{% else %}\n  [[unit_prefix]] {{ raw | float(0)\
        \ | round([[decimals]]) }} [[unit_sufix]]\n{% endif %}\n"
      tap_action:
        action: none
      card_mod:
        style: "ha-card {\n  border: none;\n  margin-bottom: -10px;\n}\n"
  disk_usage:
    default:
    - entity: ''
    - entity_second: ''
    - entity_aux: ''
    - color: ''
    - name: ''
    - icon: mdi:harddisk
    card:
      type: custom:button-card
      show_state: true
      variables:
        aux_entity: '[[entity_second]]'
      name: '[[name]]'
      icon: '[[icon]]'
      color: '[[color]]'
      entity: '[[entity]]'
      state_display: "[[[\n  const raw = entity?.state;\n  const invalid = ['unknown',\
        \ 'unavailable', 'none', ''];\n\n  if (!raw || invalid.includes(raw)) {\n\
        \    return '<span style=\"font-size:16px;font-weight:500;\">Indisponível</span>';\n\
        \  }\n\n  const value = Number(raw);\n\n  if (!Number.isFinite(value)) {\n\
        \    return '<span style=\"font-size:16px;font-weight:500;\">Indisponível</span>';\n\
        \  }\n\n  return value.toFixed(2)\n    + '<span style=\"font-size:18px;font-weight:300;color:[[color]];\"\
        > GB</span>';\n]]]\n"
      custom_fields:
        perc: "[[[\n  const ref = states[variables.aux_entity];\n  const raw = ref?.state;\n\
          \  const invalid = ['unknown', 'unavailable', 'none', ''];\n\n  if (!raw\
          \ || invalid.includes(raw)) {\n    return 'Indisponível';\n  }\n\n  const\
          \ value = Number(raw);\n\n  if (!Number.isFinite(value)) {\n    return 'Indisponível';\n\
          \  }\n\n  return `${value.toFixed(0)}%`;\n]]]\n"
        chart:
          card:
            type: custom:entity-progress-card
            entity: '[[entity]]'
            name: Uso do Disco
            max_value: '[[entity_aux]]'
            disable_unit: true
            frameless: true
            marginless: true
            bar_color: '[[color]]'
            bar_size: medium
            bar_effect:
            - radius
            hide:
            - icon
            - name
            - value
            - secondary_info
      styles:
        grid:
        - grid-template-areas: '"i n n" "s s perc" "chart chart chart"'
        - grid-template-columns: 40px 1fr 1fr;
        - grid-template-rows: min-content min-content min-content
        card:
        - padding: 8px 8px 8px 8px
        name:
        - justify-self: start
        - font-size: 14px
        - font-weight: 500
        state:
        - margin-top: 7px
        - margin-bottom: 5px
        - justify-self: start
        - font-size: 24px
        - font-weight: 700
        - padding-left: 10px
        icon:
        - width: 24px
        custom_fields:
          chart: null
          perc:
          - justify-self: end
          - font-size: 14px
          - font-weight: 400
          - padding-right: 10px
  internet_status:
    card:
      type: horizontal-stack
      cards:
      - type: custom:button-card
        entity: sensor.estado_da_internet
        name: Estado Internet
        icon: mdi:wifi
        show_icon: true
        show_name: true
        show_state: true
        styles:
          grid:
          - grid-template-areas: '"i n" "i s" "chart chart"'
          - grid-template-columns: 55px 1fr
          - grid-template-rows: min-content min-content min-content
          card:
          - padding: 0px 8px 8px
          name:
          - font-size: 14px
          - font-weight: 500
          - justify-self: start
          - line-height: 20px
          - padding-top: 10px
          state:
          - background-color: "[[[\n  const state = entity?.state;\n  const invalid\
              \ = ['unknown', 'unavailable', 'none', ''];\n\n  if (!state || invalid.includes(state))\
              \ {\n    return 'rgba(128, 128, 128, 0.20)';\n  }\n\n  return entity.attributes?.background\n\
              \    || 'rgba(128, 128, 128, 0.20)';\n]]]\n"
          - color: "[[[\n  const state = entity?.state;\n  const invalid = ['unknown',\
              \ 'unavailable', 'none', ''];\n\n  if (!state || invalid.includes(state))\
              \ {\n    return 'rgb(128, 128, 128)';\n  }\n\n  return entity.attributes?.color\n\
              \    || 'rgb(128, 128, 128)';\n]]]\n"
          - border-radius: 12px
          - letter-spacing: 0.1em
          - text-transform: uppercase
          - padding: 4px 8px
          - justify-self: start
          - font-size: 11px
          icon:
          - color: "[[[\n  const state = entity?.state;\n  const invalid = ['unknown',\
              \ 'unavailable', 'none', ''];\n\n  if (!state || invalid.includes(state))\
              \ {\n    return 'rgb(128, 128, 128)';\n  }\n\n  return entity.attributes?.color\n\
              \    || 'rgb(128, 128, 128)';\n]]]\n"
          - padding-top: 5px
          - margin-left: 5px
          - width: 40px
          - height: 40px
          custom_fields:
            chart:
            - margin-top: 6px
            - margin-bottom: 3px
            - padding-right: 10px
            - padding-left: 10px
        custom_fields:
          chart:
            card:
              type: custom:waterfall-history-card
              title: Histórico
              hours: 24
              entities:
              - entity: sensor.estado_da_internet
                name: Estado
              state_on: Excelente
              color_on: "[[[\n  return entity.attributes?.color_on || 'green';\n]]]\n"
              color_off: "[[[\n  return entity.attributes?.color_off || 'red';\n]]]\n"
              color_unknown: "[[[\n  return entity.attributes?.color_unknown || 'rgb(128,\
                \ 128, 128)';\n]]]\n"
              color_unavailable: "[[[\n  return entity.attributes?.color_unavailable\
                \ || 'red';\n]]]\n"
              state_unavailable: Indisponível
              state_unknown: Indisponível
              state_off: Indisponível
              inline_layout: true
              show_current: false
              compact: true
              show_icons: false
              show_labels: false
              height: 13
              show_min_max: false
              grid_options:
                columns: 6
                rows: auto
              intervals: 16
              card_mod:
                style: ".card-header, .entity-name {\n  display: none !important;\n\
                  }\n.entity-inline-container {\n  display: block !important;\n  margin-bottom:\
                  \ 0px !important;\n}\n:host {\n  padding: 0px !important;\n  border:\
                  \ none !important;\n}\n"
      - type: custom:button-card
        variables:
          entity: sensor.qualidade_da_internet_limitada
        entity: '[[[ return variables.entity ]]]'
        name: Qualidade Internet
        icon: mdi:signal
        show_icon: true
        show_name: true
        show_state: true
        state_display: "[[[\n  const currentRaw = entity?.state;\n  const originalRaw\
          \ = states['sensor.qualidade_da_internet']?.state;\n  const invalid = ['unknown',\
          \ 'unavailable', 'none', ''];\n\n  if (\n    !currentRaw ||\n    invalid.includes(currentRaw)\
          \ ||\n    !Number.isFinite(Number(currentRaw))\n  ) {\n    return '<span\
          \ style=\"font-size:16px;font-weight:500;\">Indisponível</span>';\n  }\n\
          \n  const current = Number(currentRaw);\n  const original = Number(originalRaw);\n\
          \  const hasOriginal = Number.isFinite(original);\n\n  const arrow = hasOriginal\
          \ && original > 100\n    ? '<ha-icon icon=\"mdi:arrow-up-thick\" style=\"\
          width:18px;height:18px;vertical-align:top;margin-top:1px\"></ha-icon>'\n\
          \    : '';\n\n  return `${current.toFixed(0)}% <span style=\"font-size:\
          \ 12px; vertical-align: middle;\">${arrow}</span>`;\n]]]\n"
        custom_fields:
          chart:
            card:
              type: custom:entity-progress-card
              entity: '[[[ return variables.entity ]]]'
              hide:
              - icon
              - name
              - value
              - secondary_info
              disable_unit: true
              frameless: true
              marginless: true
              unit: '%'
              bar_size: medium
              bar_effect:
              - radius
              custom_theme:
              - min: 0
                max: 50
                color: "[[[\n  return entity?.attributes?.color\n    || 'rgb(211,\
                  \ 47, 47)';\n]]]\n"
              - min: 50
                max: 80
                color: "[[[\n  return entity?.attributes?.color\n    || 'rgb(245,\
                  \ 124, 0)';\n]]]\n"
              - min: 80
                max: 120
                color: "[[[\n  return entity?.attributes?.color\n    || 'rgb(46, 125,\
                  \ 50)';\n]]]\n"
        styles:
          grid:
          - grid-template-areas: '"i n" "i s" "chart chart"'
          - grid-template-columns: 55px 1fr
          - grid-template-rows: min-content min-content min-content
          card:
          - padding: 0px 8px 8px
          name:
          - font-size: 14px
          - font-weight: 500
          - justify-self: start
          - line-height: 20px
          - padding-top: 10px
          state:
          - font-size: 18px
          - font-weight: 700
          - justify-self: start
          - letter-spacing: 1px
          icon:
          - color: "[[[\n  return entity.attributes.color;\n]]]\n"
          - padding-top: 5px
          - margin-left: 5px
          - width: 40px
          - height: 40px
          custom_fields:
            chart:
            - margin-top: 4px
            - margin-bottom: 3px
  raspberry_fan:
    card:
      type: tile
      grid_options:
        columns: full
        rows: auto
      entity: climate.rpi_cooling_fan_controller
      name: Ventoinha do Raspberry Pi
      icon: mdi:fan
      color: dodgerblue
      state_content:
      - state
      - current_temperature
      - temperature
      vertical: false
      features:
      - type: climate-hvac-modes
      features_position: bottom
      card_mod:
        style: "ha-state-icon {\n  {% set status = states('switch.rpi_cooling_fan')\
          \ %}\n  {% if status == 'on' %}    \n    animation: spin 3s linear infinite;\n\
          \  {% endif %}\n}\n@keyframes spin {\n  0% { transform: rotate(0deg); }\n\
          \  50% { transform: rotate(180deg); }\n  100% { transform: rotate(360deg);\
          \ }\n}\n"
  rpi_status:
    card:
      type: custom:button-card
      show_state: false
      name: Raspberry Pi
      icon: mdi:raspberry-pi
      custom_fields:
        temp:
          card:
            type: custom:ring-tile
            entity: sensor.system_monitor_processor_temperature
            max:
              entity: climate.rpi_cooling_fan_controller
              attribute: max_temp
            indicator: dot
            scale: ticks_with_labels
            ring_only: true
            ring_size: 2
            middle_element: value_with_unit
            bottom_element: none
            top_element: icon
            min_sig_figs: 3
            tweaks:
              rt-ring-svg-size: 85px
            colorize_icon: true
            colour:
              '40': dodgerblue
              '55': orange
              '65': red
            card_mod:
              style: "ha-card {\n  border: none;\n}\n"
        cpu_mem:
          card:
            type: vertical-stack
            cards:
            - type: custom:entity-progress-card-template
              entity: sensor.system_monitor_processor_use
              name: "<span style=\"\n  display:inline-block;\n  width:40%;\n  text-align:left;\n\
                \  font-weight:normal;\n  font-size: 12px;\n\">Processador</span>\
                \                  \n{% set raw = states(entity) %}\n{% if raw in\
                \ ['unknown', 'unavailable', 'none', ''] %}\n  <span style=\"\n  \
                \  float:right;\n    width:58%;\n    font-weight:normal;\n    font-weight:bold;\n\
                \  \">Indisponível</span>\n{% else %}\n  <span style=\"\n    display:inline-block;\n\
                \    width:58%;\n    text-align:right;\n    font-weight:bold;\n  \
                \  font-size: 12px;\n  \">{{ raw | float(0) | round(0) }}%</span>\n\
                {% endif %}"
              percent: '{{states(entity)}}'
              bar_color: dodgerblue
              bar_size: medium
              frameless: true
              marginless: true
              bar_effect:
              - radius
              hide:
              - icon
              - value
              - secondary_info
              card_mod:
                style: "ha-card {\n  --current-card-border-radius: 0px !important;\n\
                  }\n"
            - type: custom:entity-progress-card-template
              entity: sensor.system_monitor_memory_usage
              name: "<span style=\"\n  display:inline-block;\n  width:40%;\n  text-align:left;\n\
                \  font-weight:normal;\n  font-size: 12px;\n\">Memória</span>\n{%\
                \ set raw = states(entity) %}\n{% if raw in ['unknown', 'unavailable',\
                \ 'none', ''] %}\n  <span style=\"\n    float:right;\n    width:58%;\n\
                \    font-weight:normal;\n    font-size: 12px;\n    font-weight:bold;\n\
                \  \">Indisponível</span>\n{% else %}\n  <span style=\"\n    display:inline-block;\n\
                \    width:58%;\n    text-align:right;\n    font-weight:bold;\n  \
                \  font-size: 12px;\n  \">{{ raw | float(0) | round(0) }}%</span>\n\
                {% endif %}"
              percent: "{% set raw = states(entity) %} {% if raw in ['unknown', 'unavailable',\
                \ 'none', ''] %}\n  0\n{% else %}\n  {{ raw | float(0) }}\n{% endif\
                \ %}"
              bar_color: mediumseagreen
              bar_size: medium
              frameless: true
              marginless: true
              bar_effect:
              - radius
              hide:
              - icon
              - value
              - secondary_info
              card_mod:
                style: "ha-card {\n  --current-card-border-radius: 0px !important;\n\
                  }\n"
      styles:
        grid:
        - grid-template-areas: '"i n n" "temp temp cpu_mem"'
        - grid-template-columns: 0.20fr 0.25fr 1fr
        card:
        - padding: 8px 0px 0px 0px
        name:
        - font-size: 14px
        - font-weight: bold
        - justify-self: start
        icon:
        - color: dodgerblue
        - width: 24px
        - height: 24px
        custom_fields:
          temp:
          - margin-top: -5px
          cpu_mem:
          - margin-top: -10px
          - margin-right: 8px
          - margin-bottom: 5px
  camera_status:
    default:
    - entity: sensor.total_cameras_off_template
    card:
      type: custom:mushroom-template-card
      icon: "{% set raw = states(entity) %}\n\n{% if raw in ['unknown', 'unavailable',\
        \ 'none', ''] %}\n  mdi:cctv-off\n{% else %}\n  {% set total = raw | int(0)\
        \ %}\n  {% if total > 0 %}\n    mdi:cctv-off\n  {% else %}\n    mdi:cctv\n\
        \  {% endif %}\n{% endif %}"
      features_position: bottom
      entity: '[[entity]]'
      secondary: "{% set raw = states(entity) %}\n\n{% if raw in ['unknown', 'unavailable',\
        \ 'none', ''] %}\n  Indisponível\n{% else %}\n  {% set total = raw | int(0)\
        \ %}\n  {% if total > 0 %}\n    {{ total }} offline\n  {% else %}\n    Câmeras\
        \ online\n  {% endif %}\n{% endif %}"
      primary: Estado Câmeras
      color: "{% set raw = states(entity) %}\n\n{% if raw in ['unknown', 'unavailable',\
        \ 'none', ''] %}\n  disabled\n{% elif raw | int(0) > 0 %}\n  red\n{% else\
        \ %}\n  green\n{% endif %}"
      tap_action:
        action: navigate
        navigation_path: /lovelace/cameras
  battery_card:
    default:
    - entity: ''
    - name: ''
    - navigate: /lovelace/bateria
    card:
      type: custom:mushroom-template-card
      entity: '[[entity]]'
      primary: "{% if name is defined and name != '' %}\n  [[name]]\n{% else %}\n\
        \  {{ state_attr(entity, 'friendly_name') }}\n{% endif %}\n"
      secondary: "{% set raw = states(entity) %}\n\n{% if raw in ['unknown', 'unavailable',\
        \ 'none', ''] %}\n  Indisponível\n{% else %}\n  {{ raw | float(0) | round(0)\
        \ }}%\n{% endif %}\n"
      icon: "{% set raw = states(entity) %}\n\n{% if raw in ['unknown', 'unavailable',\
        \ 'none', ''] %}\n  mdi:battery-unknown\n{% else %}\n  {% set bat = raw |\
        \ float(0) %}\n  {% set bat = [[bat, 0] | max, 100] | min %}\n  {% set level\
        \ = ((bat / 10) | round(0) * 10) | int(0) %}\n\n  {% if bat <= 5 %}\n    mdi:battery-alert\n\
        \  {% elif bat >= 100 %}\n    mdi:battery\n  {% else %}\n    mdi:battery-{{\
        \ level }}\n  {% endif %}\n{% endif %}"
      features_position: bottom
      color: "{% set raw = states(entity) %}\n\n{% if raw in ['unknown', 'unavailable',\
        \ 'none', ''] %}\n  rgb(128, 128, 128)\n{% else %}\n  {% set bat = raw | float(0)\
        \ %}\n  {% if bat < 10 %}\n    red\n  {% elif bat < 25 %}\n    orangered\n\
        \  {% elif bat < 40 %}\n    orange\n  {% elif bat < 60 %}\n    amber\n  {%\
        \ elif bat < 80 %}\n    lightgreen\n  {% else %}\n    green\n  {% endif %}\n\
        {% endif %}\n"
      icon_tap_action:
        action: more-info
      tap_action:
        action: navigate
        navigation_path: '[[navigate]]'
  mushroom_chart:
    default:
    - entity: ''
    - entity_suffix: ''
    - name: ''
    - color: ''
    - icon: ''
    - height: '150'
    - show_extrema: false
    - show_entity_state: false
    - graph_type: line
    - hours: 48
    - align: left
    card:
      type: custom:vertical-stack-in-card
      cards:
      - type: custom:mushroom-template-card
        secondary: "{% set raw = states(entity) %}\n\n{% if [[show_entity_state]]\
          \ == false %}\n  {% if raw in ['unknown', 'unavailable', 'none', ''] %}\n\
          \    Indisponível\n  {% else %}\n    {{ raw }}[[entity_suffix]]\n  {% endif\
          \ %}\n{% endif %}\n"
        entity: '[[entity]]'
        primary: '[[name]]'
        icon: '[[icon]]'
        tap_action:
          action: navigate
          navigation_path: /lovelace/devices
        hold_action:
          action: more-info
        color: '[[color]]'
        features_position: bottom
      - type: custom:mini-graph-card
        entities:
        - entity: '[[entity]]'
          color: '[[color]]'
        hours_to_show: '[[hours]]'
        line_width: 5
        animate: false
        decimals: 2
        height: '[[height]]'
        align_state: '[[align]]'
        hour24: true
        show:
          name: false
          icon: false
          points: false
          labels: false
          state: '[[show_entity_state]]'
          legend: false
          extrema: '[[show_extrema]]'
          graph: '[[graph_type]]'
        card_mod:
          style: "ha-card {\n  box-shadow: none;\n  border: none;\n  margin: -10px\
            \ 8px 8px 8px;\n  clip-path: inset(0 round 0 0 12px 12px);\n  .info {\n\
            \    font-size: 10px;\n  }\n}\n.states {\n  margin-top: -15px;\n  font-weight:\
            \ 600 !important;\n  font-size: 10px !important;\n  padding-top: 0px !important;\n\
            \  padding-bottom: 5px !important;\n  .state__uom {\n    font-weight:\
            \ 300;\n  }\n}\n"
button_card_templates:
  action_button:
    variables:
      entity: ''
      icon: ''
      name: ''
      color: ''
      background: ''
      label: ''
    entity: '[[[ return variables.entity; ]]]'
    icon: '[[[ return variables.icon; ]]]'
    name: '[[[ return variables.name; ]]]'
    label: '[[[ return variables.label; ]]]'
    show_label: true
    styles:
      card:
      - padding: 8px
      - height: 100%
      grid:
      - grid-template-areas: '''n i'' ''l l'''
      img_cell:
      - justify-self: end
      - align-self: start
      - background: '[[[ return variables.background; ]]]'
      - border-radius: 100%
      - width: 20px
      - height: 20px
      - padding: 5px
      - margin-top: -3px
      - margin-right: -3px
      icon:
      - width: 16px
      - color: '[[[ return variables.color; ]]]'
      name:
      - justify-self: start
      - align-self: start
      - font-size: 14px
      - font-weight: 500
      - padding: 2px
      - margin-top: 3px
      label:
      - justify-self: start
      - font-size: 11px
      - font-weight: 300
      - padding-left: 2px
      - margin-top: -5px
    tap_action:
