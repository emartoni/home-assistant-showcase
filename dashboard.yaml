          data_generator: "const s = hass.states['sensor.energia_gasto_mensal'];\n\
            if (!s) return [];\n\nconst a = s.attributes || {};\nconst currentValue\
            \ = Number(s.state) || 0;\n\nconst points = [];\nlet carry = 0;\n\nfor\
            \ (let i = 5; i >= 0; i--) {\n\n  const date = moment()\n    .subtract(i,\
            \ 'months')\n    .startOf('month')\n    .valueOf();\n\n  let value = 0;\n\
            \n  if (i === 0) {\n    value = currentValue;\n  } else {\n    value =\
            \ Number(a[`mes_${i}_valor`]) || 0;\n  }\n\n  // \U0001F525 soma carry\
            \ anterior\n  value += carry;\n\n  // \U0001F525 se menor que 70\n  if\
            \ (value < 70) {\n    carry = value;\n    value = 0;\n  } else {\n   \
            \ carry = 0;\n  }\n\n  points.push([date, value]);\n}\n\nreturn points;\n"
