# 🧠 Score de qualidade
- sensor:
  - name: "Qualidade da Internet"
    unique_id: internet_qualidade_score
    unit_of_measurement: "%"
    state: >
      {% set media =
      states('sensor.internet_media_3h')|float(0) %}
    
      {% set desvio =
      states('sensor.internet_desvio')|float(0) %}
    
      {% set estabilidade =
      [100 - (desvio * 2),0] | max %}
    
      {{ ((media*0.7)+(estabilidade*0.3))
      | round(1) }}
    attributes:
      maximo: "{{ states('input_number.internet_qualidade_maxima') }}"

# 🧠 Score de qualidade (limitado)      
- sensor:
  - name: "Qualidade da Internet (Limitada)"
    unique_id: internet_qualidade_score_limitado
    unit_of_measurement: "%"
    state: >
      {{
        [[states('sensor.qualidade_da_internet')|float(0), 100] | min, 0] | max | round(1)
      }}
    attributes:
      color: >
        {% set q = [[states('sensor.qualidade_da_internet')|float(0), 100] | min, 0] | max | round(1) %}
        {% if q > 80 %}
          rgb(33, 150, 243)
        {% elif q < 50 %}
          rgb(255, 0, 0)
        {% else %}
          rgb(255, 165, 0)
        {% endif %}
      background: >
        {% set q = [[states('sensor.qualidade_da_internet')|float(0), 100] | min, 0] | max | round(1) %}
        {% if q > 80 %}
          rgba(33, 150, 243, 0.2)
        {% elif q < 50 %}
          rgba(255, 0, 0, 0.2)
        {% else %}
          rgba(255, 165, 0, 0.2)
        {% endif %}

# Estado da internet      
- sensor:
  - name: "Estado da Internet"
    unique_id: estado_internet
    icon: mdi:wifi
    variables:
      color_unknown: "rgb(255, 0, 0)"
      color_excelente: "rgb(76, 175, 80)"
      color_boa: "rgb(144, 238, 144)"
      color_instavel: "rgb(255, 165, 0)"
      color_critica: "rgb(255, 0, 0)"
    state: >
      {% set media = states('sensor.internet_media_3h') %}
      {% set desvio = states('sensor.internet_desvio') %}
      {% set score = states('sensor.qualidade_da_internet') %}

      {% if media in ['unknown','unavailable'] %}
        Indisponível

      {% else %}
        {% set score = score | float(0) %}
        {% set desvio = desvio | float(0) %}

        {% if score >= 95 and desvio < 10 %}
          Excelente
        {% elif score >= 80 and desvio < 15 %}
          Boa
        {% elif score >= 60 %}
          Instável
        {% else %}
          Crítica
        {% endif %}
      {% endif %}
    attributes:
      color: >
        {% set media = states('sensor.internet_media_3h') %}
        {% set desvio = states('sensor.internet_desvio') %}
        {% set score = states('sensor.qualidade_da_internet') %}
  
        {% if media in ['unknown','unavailable'] %}
          {{color_unknown}}
  
        {% else %}
          {% set score = score | float(0) %}
          {% set desvio = desvio | float(0) %}
  
          {% if score >= 95 and desvio < 10 %}
            {{color_excelente}}
          {% elif score >= 80 and desvio < 15 %}
            {{color_boa}}
          {% elif score >= 60 %}
            {{color_instavel}}
          {% else %}
            {{color_critica}}
          {% endif %}
        {% endif %}
      color_on: >
        {{color_excelente}}
      color_off: >
        {{color_critica}}
      color_unknown: >
        {{color_unknown}}
      color_unavailable: >
        {{color_instavel}}
      background: >
        {% set media = states('sensor.internet_media_3h') %}
        {% set desvio = states('sensor.internet_desvio') %}
        {% set score = states('sensor.qualidade_da_internet') %}
  
        {% if media in ['unknown','unavailable'] %}
          rgba(255, 0, 0, 0.2)
  
        {% else %}
          {% set score = score | float(0) %}
          {% set desvio = desvio | float(0) %}
  
          {% if score >= 95 and desvio < 10 %}
            rgba(76, 175, 80, 0.2)
          {% elif score >= 80 and desvio < 15 %}
            rgba(144, 238, 144, 0.2)
          {% elif score >= 60 %}
            rgba(255, 165, 0, 0.2)
          {% else %}
            rgba(255, 0, 0, 0.2)
          {% endif %}
        {% endif %}

# Eficiência Solar
- sensor:
  - name: "Solar Eficiência do Dia"
    unique_id: solar_eficiencia_dia
    unit_of_measurement: "%"
    state_class: measurement
    device_class: power_factor
    icon: mdi:target
    state: >
      {% set gerado = states('sensor.inversor_solis_geracao_solar_diaria') | float(0) %}
      {% set previsto = states('sensor.solcast_pv_forecast_forecast_today') | float(0) %}
      {% if previsto > 0 %}
        {{ ((gerado / previsto) * 100) | round(1) }}
      {% else %}
        0
      {% endif %}
    availability: >
      {{ states('sensor.inversor_solis_geracao_solar_diaria') not in ['unavailable', 'unknown']
         and states('sensor.solcast_pv_forecast_forecast_today') not in ['unavailable', 'unknown'] }}