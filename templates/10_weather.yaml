      attributes:
        temperature_unit: "{{ state_attr('weather.google_weather', 'temperature_unit') | default('', true) }}"
        precipitation_unit: "{{ state_attr('weather.google_weather', 'precipitation_unit') | default('', true) }}"

        forecast: "{{ fc }}"

        max_precipitation_today: >
          {% set p = (fc[0].precipitation if (fc | count) > 0 else 0) %}
          {{ p | float(0) }}

