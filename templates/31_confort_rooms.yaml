    # ------------------------------------------------------------
    # SUITE
    # ------------------------------------------------------------
    - name: "Suite Conforto"
      unique_id: suite_conforto
      icon: mdi:bed

      variables:
        temp: "{{ states('sensor.temperature_and_humidity_sensor_4_temperature') | float(none) }}"
        hum: "{{ states('sensor.temperature_and_humidity_sensor_4_humidity') | float(none) }}"
        referencia: "{{ states('input_number.suite_umidade_referencia') | float(none) }}"

        temp_externa: "{{ states('sensor.google_weather_temperatura') | float(none) }}"
        hum_externa: "{{ states('sensor.google_weather_umidade') | float(none) }}"

      availability: >-
        {{ temp is not none and hum is not none }}

      state: >-
        {% if temp is none or hum is none %}
          Indisponível
        {% else %}
          {% set temp_penalty =
              0 if 20 <= temp <= 26 else
              50 if temp <= 14 or temp >= 32 else
              ((20 - temp) * (50/6)) if temp < 20 else
              ((temp - 26) * (50/6))
          %}
          {% set hum_penalty =
              0 if 40 <= hum <= 60 else
              50 if hum <= 20 or hum >= 80 else
              ((40 - hum) * (50/20)) if hum < 40 else
              ((hum - 60) * (50/20))
          %}
          {% set score = [0, [100, 100 - temp_penalty - hum_penalty] | min] | max | round(0) %}
          {% if score >= 80 %}
            Confortável
          {% elif score >= 60 %}
            Atenção
          {% else %}
            Desconfortável
          {% endif %}
        {% endif %}

      attributes:
        color: >-
          {% if temp is none or hum is none %}
            grey
          {% else %}
            {% set temp_penalty =
                0 if 20 <= temp <= 26 else
                50 if temp <= 14 or temp >= 32 else
                ((20 - temp) * (50/6)) if temp < 20 else
                ((temp - 26) * (50/6))
            %}
            {% set hum_penalty =
                0 if 40 <= hum <= 60 else
                50 if hum <= 20 or hum >= 80 else
                ((40 - hum) * (50/20)) if hum < 40 else
                ((hum - 60) * (50/20))
            %}
            {% set score = [0, [100, 100 - temp_penalty - hum_penalty] | min] | max | round(0) %}
            {% if score >= 80 %}
              green
            {% elif score >= 60 %}
              orange
            {% else %}
              red
            {% endif %}
          {% endif %}
        background: >-
          {% if temp is none or hum is none %}
            grey
          {% else %}
            {% set temp_penalty =
                0 if 20 <= temp <= 26 else
                50 if temp <= 14 or temp >= 32 else
                ((20 - temp) * (50/6)) if temp < 20 else
                ((temp - 26) * (50/6))
            %}
            {% set hum_penalty =
                0 if 40 <= hum <= 60 else
                50 if hum <= 20 or hum >= 80 else
                ((40 - hum) * (50/20)) if hum < 40 else
                ((hum - 60) * (50/20))
            %}
            {% set score = [0, [100, 100 - temp_penalty - hum_penalty] | min] | max | round(0) %}
            {% if score >= 80 %}
              rgba(0, 128, 0, 0.2)
            {% elif score >= 60 %}
              rgba(255, 165, 0, 0.2)
            {% else %}
              rgba(255, 0, 0, 0.2)
            {% endif %}
          {% endif %}
        indice: >-
          {% if temp is none or hum is none %}
            {{ none }}
          {% else %}
            {% set temp_penalty =
                0 if 20 <= temp <= 26 else
                50 if temp <= 14 or temp >= 32 else
                ((20 - temp) * (50/6)) if temp < 20 else
                ((temp - 26) * (50/6))
            %}
            {% set hum_penalty =
                0 if 40 <= hum <= 60 else
                50 if hum <= 20 or hum >= 80 else
                ((40 - hum) * (50/20)) if hum < 40 else
                ((hum - 60) * (50/20))
            %}
            {{ [0, [100, 100 - temp_penalty - hum_penalty] | min] | max | round(0) }}
          {% endif %}

