# ============================================================
#  ENERGIA E POTÊNCIA (Template Sensors)
#  - Balanços (kWh)
#  - Potências (kW)
#  - Percentuais
#  - Consumos por ambiente (kWh diário)
# ============================================================
- sensor:
    # ------------------------------------------------------------
    # CONSUMOS DIÁRIOS POR AMBIENTE (kWh)
    # ------------------------------------------------------------
    - name: "Consumo Diário Cozinha"
      unique_id: consumo_diario_cozinha
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total
      icon: mdi:lightning-bolt
      availability: >-
        {% set entidades = [
          'sensor.cozinha_central_light_energy',
          'sensor.cozinha_led_light_energy',
          'sensor.pendente_jantar_energy',
          'sensor.cozinha_corredor_light_energy',
          'sensor.garagem_light_energy'
        ] %}
        {% set ns = namespace(validas=0) %}
      
        {% for entidade in entidades %}
          {% set valor = states(entidade) %}
          {% if valor not in ['unknown', 'unavailable', 'none', ''] and valor | float(none) is not none %}
            {% set ns.validas = ns.validas + 1 %}
          {% endif %}
        {% endfor %}
      
        {{ ns.validas == entidades | length }}
      state: >-
        {% set entidades = [
          'sensor.cozinha_central_light_energy',
          'sensor.cozinha_led_light_energy',
          'sensor.pendente_jantar_energy',
          'sensor.cozinha_corredor_light_energy',
          'sensor.garagem_light_energy'
        ] %}
        {% set ns = namespace(total=0) %}
      
        {% for entidade in entidades %}
          {% set ns.total = ns.total + states(entidade) | float(0) %}
        {% endfor %}
      
        {{ ns.total | round(3) }}

